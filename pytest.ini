[pytest]
# Paths are relative to this ini's directory (team_plugin/):
#   ../thirdparty/hermes-agent -> $HA, the pinned substrate (imports land on
#     hermes_cli, hermes_constants, utils, ...)
# The plugin dir is deliberately NOT on pythonpath: conftest loads it as the
# package ``hermes_agent_synergia`` (mirroring PluginManager's directory-as-package
# import) and aliases its submodules, so there is one module identity per name.
pythonpath = ../hermes-agent
testpaths = tests
# Mirror of the substrate's own CI guard (plugins/AGENTS.md): a plugin that
# trips the compat scanner is skipped entirely after COMPAT_REMOVAL_DATE, so
# treat its warning as an error here.
filterwarnings =
    error::hermes_cli.plugin_compat.HermesPluginCompatWarning
